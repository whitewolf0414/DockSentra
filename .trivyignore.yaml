# .trivyignore.yaml
#
# Documents CRITICAL/HIGH CVEs that have NO available upstream fix as of the
# date below. These come from base OS packages (Debian 12) and are not
# introduced by DockSentra's own code.
#
# Source: Jenkins build #5 (dockerfile-security-checker:5), scanned 2026-07-29
# All fixable CVEs were already resolved via Dockerfile changes:
#   - apt-get upgrade -y
#   - pip install --upgrade pip setuptools wheel
# Everything listed below remains after those fixes were applied.
#
# IMPORTANT: expired_at is set ~30 days out. When an entry expires, Trivy
# will start flagging it again automatically — treat that as a prompt to
# re-scan and check whether upstream has shipped a fix yet. If still
# unfixed, renew the expiry date. If fixed, delete the entry (Trivy will
# no longer find it anyway once the package is patched).
#
# Do not add new entries here without checking the Trivy "Status" field
# first (only affected / fix_deferred / will_not_fix belong here — never
# an entry whose Status is "fixed").

